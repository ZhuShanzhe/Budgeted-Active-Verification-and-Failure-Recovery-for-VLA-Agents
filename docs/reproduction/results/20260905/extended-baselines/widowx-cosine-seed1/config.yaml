dataset:
  name: openvla
  subset_name: widowx
  data_path_prefix: /root/autodl-tmp/datasets/safe-rollouts/widowx-extracted/
  data_path: /root/autodl-tmp/datasets/safe-rollouts/widowx-extracted/openvla_widowx/**/
  data_path_unseen: null
  load_to_cuda: false
  normalize_hidden_states: false
